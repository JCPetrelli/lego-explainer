<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LEGO Explainer Gallery</title>
<style>
  :root { --bg: #f3f1ea; --card: #fff; --ink: #1b2a34; --muted: #6c6e68; --accent: #c91a09; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181c; --card: #22252b; --ink: #eceae4; --muted: #9a9c96; --accent: #f2cd37; }
  }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 920px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 22px; margin: 0 0 20px; }
  h1 span { color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .card { display: block; background: var(--card); border-radius: 10px; padding: 16px;
           color: inherit; text-decoration: none; border-top: 5px solid var(--accent); }
  .card:hover { transform: translateY(-2px); }
  .card h2 { font-size: 16px; margin: 0 0 6px; }
  .meta { color: var(--muted); font-size: 13px; }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<main>
<h1><span>&#9632;</span> LEGO Explainer builds</h1>
<div class="grid">
<a class="card" href="web-request.html">
  <h2>Web Request Lifecycle</h2>
  <div class="meta">themed &middot; 14 pieces</div>
</a>
<a class="card" href="relativity.html">
  <h2>Theory of Relativity</h2>
  <div class="meta">stack &middot; 19 pieces</div>
</a>
<a class="card" href="lego-explainer.html">
  <h2>LEGO Explainer Internals</h2>
  <div class="meta">stack &middot; 17 pieces</div>
</a>
</div>
</main>
</body>
</html>
