<style>
  :root {
    --scene-bg: #ece8de;
    --panel: rgba(255, 255, 255, 0.92);
    --ink: #1b2a34;
    --muted: #5f625c;
    --line: #1b2a34;
    --accent: #c91a09;
    --btn: #1b2a34;
    --btn-ink: #ffffff;
    --shadow: 0 6px 24px rgba(0, 0, 0, 0.14);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --scene-bg: #17191d;
      --panel: rgba(34, 37, 43, 0.94);
      --ink: #eceae4;
      --muted: #a3a59f;
      --line: #f4f4f4;
      --accent: #f2cd37;
      --btn: #f2cd37;
      --btn-ink: #1b2a34;
      --shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --scene-bg: #17191d; --panel: rgba(34, 37, 43, 0.94); --ink: #eceae4; --muted: #a3a59f;
    --line: #f4f4f4; --accent: #f2cd37; --btn: #f2cd37; --btn-ink: #1b2a34;
    --shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--scene-bg); color: var(--ink);
         font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  #scene { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  .panel { background: var(--panel); border-radius: 12px; box-shadow: var(--shadow);
           backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #hud { position: fixed; top: 16px; left: 16px; max-width: min(420px, calc(100vw - 32px)); padding: 14px 16px; }
  #hud h1 { font-size: 18px; margin: 0 0 6px; line-height: 1.25; }
  #mode { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
          color: var(--btn-ink); background: var(--accent); border-radius: 4px; padding: 2px 7px; }
  #metaphor { margin: 8px 0 0; color: var(--muted); font-size: 13px; }
  #legend { position: fixed; top: 16px; right: 16px; padding: 12px 14px; font-size: 13px; max-width: 220px; }
  #legend .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  #legend .sw { width: 14px; height: 14px; border-radius: 3px; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.2); }
  #legend .note { margin-top: 8px; color: var(--muted); font-size: 12px; }
  #controls { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
              display: flex; align-items: center; gap: 10px; padding: 8px; flex-wrap: wrap; justify-content: center;
              max-width: calc(100vw - 32px); }
  #controls button { font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 9px 18px; cursor: pointer;
                     background: var(--btn); color: var(--btn-ink); }
  #controls button.secondary { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
  #hint { color: var(--muted); font-size: 13px; padding: 0 6px; }
  #hint:empty { display: none; }
  #leader { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; overflow: visible; }
  #leader line { stroke: var(--line); stroke-width: 1.5; }
  #leader circle { fill: var(--line); }
  #hover-label { position: fixed; left: 0; top: 0; pointer-events: none; padding: 6px 10px; font-size: 13px;
                 white-space: nowrap; }
  #hover-label .grp { color: var(--muted); }
  .group-label { position: fixed; left: 0; top: 0; transform: translate(-50%, -100%); pointer-events: none;
                 font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px;
                 border-radius: 6px; background: var(--panel); box-shadow: var(--shadow); transition: opacity .3s; }
  #popup { position: fixed; left: 0; top: 0; width: 360px; max-width: calc(100vw - 32px);
           max-height: calc(100vh - 32px); overflow-y: auto; padding: 14px 16px 16px; }
  #popup h2 { margin: 0 24px 4px 0; font-size: 16px; line-height: 1.25; }
  #popup .meta { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  #popup .dots { color: var(--accent); letter-spacing: 1px; font-size: 13px; }
  #popup p { margin: 0; }
  #popup .lead { font-weight: 700; margin-bottom: 10px; }
  #popup .details { color: var(--ink); opacity: .9; }
  #popup .example { margin-top: 12px; padding: 9px 11px; border-radius: 8px; border-left: 3px solid var(--accent);
                    background: rgba(127, 127, 127, .12); font-size: 13px; }
  #popup .example-label { display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em;
                          text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
  #popup .close { position: absolute; top: 8px; right: 10px; border: 0; background: none; color: var(--muted);
                  font-size: 18px; cursor: pointer; line-height: 1; }
  #source-link { position: fixed; left: 16px; bottom: 20px; display: flex; align-items: center; gap: 8px;
                 padding: 9px 14px; color: var(--ink); text-decoration: none; font-weight: 600; }
  #source-link:hover { box-shadow: inset 0 0 0 1.5px var(--ink), var(--shadow); }
  #source-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #source-link svg { width: 18px; height: 18px; fill: currentColor; flex: none; }
  #load-error { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; }
  [hidden] { display: none !important; }
  @media (max-width: 640px) {
    #legend { top: auto; bottom: 84px; right: 16px; }
    #hud h1 { font-size: 16px; }
    #source-link { bottom: 84px; }
  }
</style>

<script type="application/json" id="lego-spec">{"title": "LEGO Explainer Internals", "target": "the lego-explainer repository", "mode": "stack", "metaphor": "Stack: runtimes at the bottom, the Python engine and the 3D viewer on top of them, and Claude's workflow at the top, driving both.", "groups": [{"id": "runtime", "title": "Runtimes", "description": "What everything runs on: Python to build pages, three.js in the browser to draw them.", "color": "dark-grey"}, {"id": "engine", "title": "Engine", "description": "Python package. Checks a build spec, turns it into one HTML page, keeps the gallery.", "color": "blue"}, {"id": "viewer", "title": "Viewer", "description": "Fixed three.js page. Draws the bricks and handles orbit, explode, hover and popups.", "color": "red"}, {"id": "workflow", "title": "Claude's workflow", "description": "The skill. Steps Claude follows to turn any target into a valid build spec.", "color": "yellow"}], "pieces": [{"id": "python", "group": "runtime", "title": "Python 3.12", "description": "Stdlib only. Runs the validator and the builder.", "details": "The build side uses only the Python standard library (json, argparse, pathlib, html), so there is nothing to pip install. Any Python 3.10 or later works; the code was developed on 3.12.", "example": "python3 -m lego_explainer.build spec.json runs with a fresh interpreter, no virtualenv.", "complexity": 4, "shape": "brick", "x": 0, "z": 0, "level": 0, "w": 4, "d": 4}, {"id": "threejs", "group": "runtime", "title": "three.js", "description": "WebGL library. Meshes, lights, shadows, mouse orbit.", "details": "three.js draws the model in the browser. It provides the rounded brick bodies, extruded slopes, soft shadows, and OrbitControls, which gives drag to orbit, scroll to zoom and right-drag to pan. The page pins version 0.160 through an import map.", "example": "Dragging left moves the camera around the model; the bricks themselves never move.", "complexity": 4, "shape": "brick", "x": 4, "z": 0, "level": 0, "w": 4, "d": 4}, {"id": "cdn", "group": "runtime", "title": "jsDelivr CDN", "description": "Serves three.js when the page opens.", "details": "three.js is not bundled into the page. The browser fetches it from cdn.jsdelivr.net, which keeps each build around 40 KB. The first open needs internet; if the download fails, the page shows an error after 6 seconds instead of a blank screen.", "example": "Opening a build with Wi-Fi off shows 'The 3D viewer could not start'.", "complexity": 1, "shape": "plate", "x": 8, "z": 0, "level": 0, "w": 1, "d": 2, "color": "azure"}, {"id": "schema", "group": "engine", "title": "schema.py", "description": "The shared vocabulary: palette, shapes, size rules.", "details": "One module holds the rules everything else agrees on: 12 LEGO colours, the height of each shape in plates, word limits, and the table that ties complexity to brick footprint. The viewer keeps a copy of the palette, so change both together.", "example": "Complexity 3 allows a 6 to 8 stud footprint: a 2x4 brick fits, a 2x2 does not.", "complexity": 2, "shape": "brick", "x": 0, "z": 0, "level": 3, "w": 2, "d": 2}, {"id": "build", "group": "engine", "title": "build.py", "description": "CLI: validate, render, write, refresh gallery.", "details": "The entry point. It reads the spec (rejecting malformed JSON and NaN), runs the validator, and injects the spec and viewer code into one self-contained HTML file. The spec is escaped so text in it can never break the page. Errors come back as a list with exit code 1.", "example": "Building the same spec twice on one day overwrites the page instead of adding a duplicate.", "complexity": 2, "shape": "brick", "x": 0, "z": 2, "level": 3, "w": 2, "d": 2}, {"id": "validate", "group": "engine", "title": "validate.py", "description": "Rejects impossible or sloppy builds, all errors at once.", "details": "Checks run in two passes. First every field: types, unknown keys, word limits, and the complexity-to-size rule. Then geometry on a cell grid: no two bricks may share a cell, and every raised brick needs studs under it. Tiles and slope faces have no studs.", "example": "A brick placed on a tile is reported as 'floating', with its coordinates.", "complexity": 3, "shape": "brick", "x": 2, "z": 0, "level": 3, "w": 2, "d": 4}, {"id": "gallery", "group": "engine", "title": "gallery.py", "description": "Index page: one card per build, newest first.", "details": "After every build it regenerates index.html from the saved specs, showing title, date, mode and piece count. Builds go to $LEGO_EXPLAINER_BUILDS if set, otherwise to builds/ in a clone, otherwise to ~/lego-explainer-builds.", "example": "just run serves the gallery at localhost:5733.", "complexity": 1, "shape": "plate", "x": 0, "z": 0, "level": 6, "w": 1, "d": 2}, {"id": "scene", "group": "viewer", "title": "Scene", "description": "Turns stud coordinates into 3D bricks on a baseplate.", "details": "One stud is one unit and a plate is 0.4 units tall. Each piece becomes a rounded box or a slope with studs on top, placed from its corner coordinates on a grey baseplate sized to fit the model. One sun light casts soft shadows.", "example": "A 2x4 brick at level 3 becomes a 2 x 1.2 x 4 box resting 1.2 units up.", "complexity": 4, "shape": "brick", "x": 4, "z": 0, "level": 3, "w": 4, "d": 3}, {"id": "explode", "group": "viewer", "title": "Explode", "description": "Three states: assembled, groups apart, one group apart.", "details": "A small state machine animates every brick for 0.6 seconds between states. Groups rise in proportion to their height and move outward in proportion to their position. A final pass pushes apart any groups whose boxes still collide. Taking one group apart fades the others.", "example": "Press E, click the Engine group, then press Esc to go back.", "complexity": 2, "shape": "brick", "x": 4, "z": 3, "level": 3, "w": 2, "d": 1}, {"id": "hover", "group": "viewer", "title": "Hover \u0026 popup", "description": "Pointer picking, leader-line labels, detail cards.", "details": "Each frame a ray from the mouse finds the brick underneath. It gets an outline and a line to its title, placed on the side away from the model. Clicking opens this card: bold summary, details, and an example. Overlays hide when their brick is behind the camera.", "example": "The card you are reading was opened this way.", "complexity": 2, "shape": "slope", "x": 6, "z": 3, "level": 3, "w": 2, "d": 1}, {"id": "understand", "group": "workflow", "title": "Understand target", "description": "Read the code or topic until the concepts are clear.", "details": "For a path, Claude reads the README and entry points and maps modules and dependencies, delegating to a search agent for large repos. For a topic, it uses its own knowledge plus web search when the topic is recent. Too-big targets get a top-level build and offers to zoom in.", "example": "Pointing it at a monorepo gives one build of the services, then an offer to build each one.", "complexity": 3, "shape": "brick", "x": 2, "z": 0, "level": 6, "w": 3, "d": 2}, {"id": "decompose", "group": "workflow", "title": "Decompose \u0026 score", "description": "4 to 8 groups, 2 to 6 pieces each, complexity 1 to 5.", "details": "Claude splits the target into sub-assemblies and single concepts a reader should leave knowing. Each concept gets an honest complexity score, and that score decides the brick's size. A trivial helper becomes a 1x1 plate; the core engine becomes a large brick.", "example": "In a web app, the router scores 1 (a tile) and the database scores 4 (a 4x4 brick).", "complexity": 3, "shape": "brick", "x": 2, "z": 2, "level": 6, "w": 3, "d": 2}, {"id": "mode", "group": "workflow", "title": "Choose mode", "description": "Themed object if the metaphor fits, stack otherwise.", "details": "A themed model (train, castle, house) is used only when every group maps to a recognisable part of one object. Otherwise it falls back to a stack, where height means dependency. The reason goes into the one-line metaphor in the header.", "example": "An HTTP request becomes a train; this repository is a stack.", "complexity": 1, "shape": "plate", "x": 3, "z": 2, "level": 9, "w": 1, "d": 2}, {"id": "layout", "group": "workflow", "title": "Lay out bricks", "description": "Place every piece on the stud grid so it makes sense.", "details": "The hardest step. Claude picks x, z and level for each piece. In a stack, foundations go at the bottom and dependents sit on what they depend on. In a themed model, parts go where they belong on the object. The two examples in the repo are the reference patterns.", "example": "Here, Claude's workflow sits on top of both the engine and the viewer, because it drives both.", "complexity": 4, "shape": "brick", "x": 5, "z": 0, "level": 6, "w": 3, "d": 4}, {"id": "text", "group": "workflow", "title": "Write text", "description": "Title, bold summary, details, one example.", "details": "Every piece gets a 1–3 word title, a summary of at most 40 words shown in bold, details of at most 120 words for a newcomer, and a concrete example of at most 60 words. The rule is no hedging and no marketing words.", "example": "This card's layout is the result.", "complexity": 2, "shape": "brick", "x": 5, "z": 0, "level": 9, "w": 1, "d": 2}, {"id": "fix", "group": "workflow", "title": "Build \u0026 fix", "description": "Run the builder, fix the reported errors, three tries.", "details": "Claude writes the spec, runs the builder, and reads the error list. Errors name the piece and the exact cell, so fixes are mechanical. After three failed attempts it stops and shows the remaining errors rather than forcing a broken build.", "example": "piece 'db' overlaps 'cache' at x=0 z=9 level=1 leads to moving the cache one stud over.", "complexity": 2, "shape": "brick", "x": 7, "z": 2, "level": 9, "w": 1, "d": 2}, {"id": "examples", "group": "workflow", "title": "Examples", "description": "Reference builds Claude reads before laying out.", "details": "The examples folder holds hand-made specs that pass validation: a themed train, this stack, and a physics topic. The tests use them as fixtures and the smoke test drives them in a real browser.", "example": "examples/web-request.json shows how to lay a train along the z axis.", "complexity": 1, "shape": "tile", "x": 2, "z": 0, "level": 9, "w": 1, "d": 2}]}</script>

<script type="module">
// LEGO Explainer viewer: renders a validated build spec as an explorable LEGO model.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// Keep in sync with lego_explainer/schema.py.
const PALETTE = {
  'red': '#c91a09', 'blue': '#0055bf', 'yellow': '#f2cd37', 'green': '#237841',
  'dark-green': '#184632', 'orange': '#fe8a18', 'white': '#f4f4f4', 'light-grey': '#a0a5a9',
  'dark-grey': '#6c6e68', 'black': '#1b2a34', 'tan': '#e4cd9e', 'azure': '#36aebf',
};
const SHAPE_HEIGHT = { brick: 3, slope: 3, plate: 1, tile: 1 };

const PLATE = 0.4;           // plate height, in stud units
const STUD_R = 0.3;
const STUD_H = 0.18;
const GAP = 0.03;            // visible seam between neighbouring bricks
const SLOPE_LIP = 0.25;
const TWEEN_MS = 600;
const FADED = 0.18;
const CLICK_SLOP = 5;        // px of pointer travel still counted as a click

const $ = (id) => document.getElementById(id);
const spec = JSON.parse($('lego-spec').textContent);
const groupIndex = new Map(spec.groups.map((g, i) => [g.id, i]));
const groupOf = (id) => spec.groups[groupIndex.get(id)];

// ---------- chrome ----------
$('title').textContent = spec.title;
$('mode').textContent = spec.mode === 'themed' ? 'Themed model' : 'Stack';
$('metaphor').textContent = spec.metaphor;
document.title = spec.title;
{
  const url = document.querySelector('meta[name="lego-source"]')?.content;
  if (url) {
    const link = $('source-link');
    link.href = url;
    link.title = 'Source code and install instructions';
    link.hidden = false;
  }
}
(() => {
  const legend = $('legend');
  for (const g of spec.groups) {
    const row = document.createElement('div');
    row.className = 'row';
    const sw = document.createElement('span');
    sw.className = 'sw';
    sw.style.background = PALETTE[g.color];
    const name = document.createElement('span');
    name.textContent = g.title;
    row.append(sw, name);
    legend.append(row);
  }
  const note = document.createElement('div');
  note.className = 'note';
  note.textContent = 'Bigger brick = more complex concept.';
  legend.append(note);
})();

// ---------- renderer, scene, camera ----------
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: $('scene'), antialias: true });
} catch (err) {
  $('load-error-msg').textContent = 'WebGL is not available in this browser.';
  $('load-error').hidden = false;
  throw err;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
scene.background = new THREE.Color(cssVar('--scene-bg') || '#ece8de');

// Model extent in studs / plates.
const minX = Math.min(...spec.pieces.map((p) => p.x));
const maxX = Math.max(...spec.pieces.map((p) => p.x + p.w));
const minZ = Math.min(...spec.pieces.map((p) => p.z));
const maxZ = Math.max(...spec.pieces.map((p) => p.z + p.d));
const topY = Math.max(...spec.pieces.map((p) => (p.level + SHAPE_HEIGHT[p.shape]) * PLATE));
const cx = (minX + maxX) / 2;
const cz = (minZ + maxZ) / 2;
const radius = Math.max(3, Math.hypot(maxX - minX, maxZ - minZ, topY) / 2);

const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 2000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.target.set(0, topY * 0.4, 0);
const homeTarget = controls.target.clone();
camera.position.set(radius * 2.1, radius * 1.7, radius * 2.6);
const baseDistance = camera.position.distanceTo(controls.target);
controls.maxDistance = baseDistance * 5;
controls.minDistance = radius * 0.6;
controls.addEventListener('start', () => { controls.autoRotate = false; });

scene.add(new THREE.HemisphereLight(0xffffff, 0x8d8779, 1.7));
const sun = new THREE.DirectionalLight(0xffffff, 2.4);
sun.position.set(radius * 1.5, radius * 3, radius * 1.1);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const shadowSpan = radius * 4 + 10;
Object.assign(sun.shadow.camera, {
  left: -shadowSpan, right: shadowSpan, top: shadowSpan, bottom: -shadowSpan,
  near: 0.5, far: radius * 12 + 40,
});
sun.shadow.bias = -0.0005;
scene.add(sun);

// ---------- geometry ----------
const studGeo = new THREE.CylinderGeometry(STUD_R, STUD_R, STUD_H, 20);

function baseplate() {
  const x0 = minX - 2, x1 = maxX + 2, z0 = minZ - 2, z1 = maxZ + 2;
  const w = x1 - x0, d = z1 - z0;
  const mat = new THREE.MeshStandardMaterial({ color: PALETTE['light-grey'], roughness: 0.55 });
  const plate = new THREE.Mesh(new THREE.BoxGeometry(w, 0.2, d), mat);
  plate.position.set((x0 + x1) / 2 - cx, -0.1, (z0 + z1) / 2 - cz);
  plate.receiveShadow = true;
  scene.add(plate);
  const studs = new THREE.InstancedMesh(studGeo, mat, w * d);
  const m = new THREE.Matrix4();
  let i = 0;
  for (let x = x0; x < x1; x++) {
    for (let z = z0; z < z1; z++) {
      m.setPosition(x + 0.5 - cx, STUD_H / 2, z + 0.5 - cz);
      studs.setMatrixAt(i++, m);
    }
  }
  studs.receiveShadow = true;
  scene.add(studs);
}

// Slope profile in the (z, y) plane, extruded along x; it falls toward +z.
function slopeGeometry(w, d, h) {
  const z0 = GAP / 2, z1 = d - GAP / 2;
  const back = d > 1 ? 1 : z0;
  const pts = [[z0, 0], [z1, 0], [z1, SLOPE_LIP], [back, h], [z0, h]];
  // Shape u = -z so that rotating +90° about Y maps (u, v, t) -> (x=t, y=v, z=z).
  const shape = new THREE.Shape(pts.map(([z, y]) => new THREE.Vector2(-z, y)));
  const geo = new THREE.ExtrudeGeometry(shape, { depth: w - GAP, bevelEnabled: false });
  geo.rotateY(Math.PI / 2);
  geo.translate(GAP / 2, 0, 0);
  geo.computeVertexNormals();
  return geo;
}

const pieces = [];   // THREE.Group per piece, userData holds state
const pickables = [];

function makePiece(p) {
  const h = SHAPE_HEIGHT[p.shape] * PLATE;
  const color = PALETTE[p.color || groupOf(p.group).color];
  const material = new THREE.MeshStandardMaterial({ color, roughness: 0.3, metalness: 0 });
  const root = new THREE.Group();

  let body, edges;
  if (p.shape === 'slope') {
    body = new THREE.Mesh(slopeGeometry(p.w, p.d, h), material);
    edges = new THREE.EdgesGeometry(body.geometry, 20);
  } else {
    body = new THREE.Mesh(new RoundedBoxGeometry(p.w - GAP, h, p.d - GAP, 2, 0.05), material);
    body.position.set(p.w / 2, h / 2, p.d / 2);
    edges = new THREE.EdgesGeometry(new THREE.BoxGeometry(p.w - GAP, h, p.d - GAP));
  }
  body.castShadow = body.receiveShadow = true;
  root.add(body);

  const outline = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xffffff }));
  outline.position.copy(body.position);
  outline.scale.setScalar(1.01);
  outline.visible = false;
  root.add(outline);

  if (p.shape !== 'tile') {
    const rows = p.shape === 'slope' ? (p.d > 1 ? 1 : 0) : p.d;
    for (let i = 0; i < p.w; i++) {
      for (let j = 0; j < rows; j++) {
        const stud = new THREE.Mesh(studGeo, material);
        stud.position.set(i + 0.5, h + STUD_H / 2, j + 0.5);
        stud.castShadow = true;
        root.add(stud);
      }
    }
  }

  const home = new THREE.Vector3(p.x - cx, p.level * PLATE, p.z - cz);
  root.position.copy(home);
  root.userData = {
    piece: p,
    home,
    height: h,
    centre: home.clone().add(new THREE.Vector3(p.w / 2, h / 2, p.d / 2)),
    material,
    outline,
    offset: new THREE.Vector3(),
    from: new THREE.Vector3(),
    to: new THREE.Vector3(),
    opacityFrom: 1,
    opacityTo: 1,
  };
  root.traverse((o) => { if (o.isMesh) { o.userData.pieceRoot = root; pickables.push(o); } });
  scene.add(root);
  pieces.push(root);
}

baseplate();
spec.pieces.forEach(makePiece);

// ---------- explode ----------
const mean = (vs) => vs.reduce((a, v) => a.add(v), new THREE.Vector3()).divideScalar(vs.length);
const modelCentre = mean(pieces.map((r) => r.userData.centre.clone()));
const groupCentre = new Map(spec.groups.map((g) => [
  g.id, mean(pieces.filter((r) => r.userData.piece.group === g.id).map((r) => r.userData.centre.clone())),
]));
const groupTop = new Map(spec.groups.map((g) => [
  g.id, Math.max(...pieces.filter((r) => r.userData.piece.group === g.id)
    .map((r) => r.userData.home.y + r.userData.height)),
]));

// Where a group sits when the model is exploded (state 2).
// Lift each group in proportion to its height, spread it outward in proportion to its
// horizontal position, then push apart any group boxes that still overlap.
function groupBox(id) {
  const box = new THREE.Box3();
  for (const r of pieces.filter((r) => r.userData.piece.group === id)) {
    const { home, piece, height } = r.userData;
    box.expandByPoint(home);
    box.expandByPoint(home.clone().add(new THREE.Vector3(piece.w, height, piece.d)));
  }
  return box;
}

const groupOffset = (() => {
  const PAD = 2;
  const boxes = spec.groups.map((g) => groupBox(g.id));
  const offsets = spec.groups.map((g, i) => {
    const c = groupCentre.get(g.id);
    const off = new THREE.Vector3(c.x - modelCentre.x, 0, c.z - modelCentre.z);
    off.y = boxes[i].min.y * 1.5 + 1.5;
    return off;
  });
  const moved = (i) => boxes[i].clone().translate(offsets[i]).expandByScalar(PAD / 2);
  for (let iter = 0; iter < 80; iter++) {
    let clean = true;
    for (let i = 0; i < boxes.length; i++) {
      for (let j = i + 1; j < boxes.length; j++) {
        const a = moved(i), b = moved(j);
        if (!a.intersectsBox(b)) continue;
        clean = false;
        const ca = a.getCenter(new THREE.Vector3()), cb = b.getCenter(new THREE.Vector3());
        const penX = Math.min(a.max.x, b.max.x) - Math.max(a.min.x, b.min.x);
        const penZ = Math.min(a.max.z, b.max.z) - Math.max(a.min.z, b.min.z);
        const axis = penX <= penZ ? 'x' : 'z';
        let sign = Math.sign(cb[axis] - ca[axis]);
        if (sign === 0) sign = (i + j) % 2 ? 1 : -1;
        const push = (Math.min(penX, penZ) / 2) + 0.01;
        offsets[i][axis] -= sign * push;
        offsets[j][axis] += sign * push;
      }
    }
    if (clean) break;
  }
  return new Map(spec.groups.map((g, i) => [g.id, offsets[i]]));
})();

// Bounding sphere of the exploded layout, used to frame the camera in state 2.
const explodedSphere = (() => {
  const box = new THREE.Box3();
  for (const g of spec.groups) box.union(groupBox(g.id).translate(groupOffset.get(g.id)));
  return box.getBoundingSphere(new THREE.Sphere());
})();

// Camera distance at which a sphere of radius r fills the view, whichever of the
// vertical or horizontal field of view is narrower.
function fitDistance(r) {
  const v = THREE.MathUtils.degToRad(camera.fov) / 2;
  const h = Math.atan(Math.tan(v) * camera.aspect);
  return (r / Math.sin(Math.min(v, h))) * 1.1;
}
controls.maxDistance = Math.max(controls.maxDistance, fitDistance(explodedSphere.radius) * 2.5);

let state = 1;
let selectedGroup = null;
let tweenStart = 0;

function targetFor(root) {
  const { piece, centre } = root.userData;
  if (state === 1) return new THREE.Vector3();
  const off = groupOffset.get(piece.group).clone();
  if (state === 3 && piece.group === selectedGroup) {
    const gc = groupCentre.get(piece.group);
    off.x += (centre.x - gc.x) * 1.4;
    off.z += (centre.z - gc.z) * 1.4;
    off.y += (centre.y - gc.y) * 3 + 1.5;
  }
  return off;
}

function setState(next, group = null) {
  state = next;
  selectedGroup = next === 3 ? group : null;
  tweenStart = performance.now();
  for (const root of pieces) {
    const u = root.userData;
    u.from.copy(u.offset);
    u.to.copy(targetFor(root));
    u.opacityFrom = u.material.opacity;
    u.opacityTo = state === 3 && u.piece.group !== selectedGroup ? FADED : 1;
  }
  const dist = camera.position.distanceTo(controls.target);
  if (next === 1) {
    focusTo = homeTarget.clone();
  } else if (next === 2) {
    focusTo = explodedSphere.center.clone();
    zoomTo = Math.max(dist, fitDistance(explodedSphere.radius));
  } else {
    focusTo = groupCentre.get(group).clone().add(groupOffset.get(group));
  }
  closePopup();
  renderControls();
  const h = hovered;  // label text depends on the state; rebuild it
  setHover(null);
  if (h) setHover(h);
}

let zoomTo = null;
let focusTo = null;
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

function stepTweens(now) {
  const e = ease(Math.min(1, (now - tweenStart) / TWEEN_MS));
  for (const root of pieces) {
    const u = root.userData;
    u.offset.lerpVectors(u.from, u.to, e);
    root.position.copy(u.home).add(u.offset);
    const op = u.opacityFrom + (u.opacityTo - u.opacityFrom) * e;
    u.material.opacity = op;
    const transparent = op < 0.999;
    if (u.material.transparent !== transparent) {
      u.material.transparent = transparent;
      u.material.needsUpdate = true;  // switches the shader program
    }
    u.material.depthWrite = op > 0.5;
  }
  if (focusTo !== null) {
    // Move camera and target together so the view pans rather than swings.
    const step = focusTo.clone().sub(controls.target).multiplyScalar(0.08);
    controls.target.add(step);
    camera.position.add(step);
    if (step.length() < 0.002) focusTo = null;
  }
  if (zoomTo !== null) {
    const dir = camera.position.clone().sub(controls.target);
    const d = dir.length();
    const nd = d + (zoomTo - d) * 0.08;
    camera.position.copy(controls.target).add(dir.setLength(nd));
    if (Math.abs(zoomTo - nd) < 0.05) zoomTo = null;
  }
}

// ---------- controls UI ----------
function renderControls() {
  const main = $('btn-main'), back = $('btn-back'), hint = $('hint');
  if (state === 1) { main.textContent = 'Explode'; back.hidden = true; hint.textContent = ''; }
  if (state === 2) { main.textContent = 'Reassemble'; back.hidden = true; hint.textContent = 'Click a group to take it apart'; }
  if (state === 3) {
    main.textContent = 'Reassemble'; back.hidden = false;
    hint.textContent = groupOf(selectedGroup).title;
  }
}
$('btn-main').addEventListener('click', () => setState(state === 1 ? 2 : 1));
$('btn-back').addEventListener('click', () => setState(2));
window.addEventListener('keydown', (ev) => {
  if (ev.key === 'e' || ev.key === 'E') setState(state === 1 ? 2 : 1);
  if (ev.key === 'Escape') {
    if (!$('popup').hidden) closePopup();
    else if (state === 3) setState(2);
  }
});

// ---------- picking, hover, popup ----------
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let pointerInside = false;
let hovered = null;
let popupPiece = null;

function pick(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.set(((clientX - rect.left) / rect.width) * 2 - 1, -((clientY - rect.top) / rect.height) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(pickables, false)[0];
  return hit ? hit.object.userData.pieceRoot : null;
}

function toScreen(v) {
  const p = v.clone().project(camera);
  return { x: (p.x + 1) / 2 * window.innerWidth, y: (1 - p.y) / 2 * window.innerHeight, behind: p.z > 1 };
}

function anchorOf(root) {
  const { piece, height } = root.userData;
  return toScreen(root.position.clone().add(new THREE.Vector3(piece.w / 2, height, piece.d / 2)));
}

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

function setHover(root) {
  if (hovered === root) return;
  if (hovered) hovered.userData.outline.visible = false;
  hovered = root;
  const label = $('hover-label');
  if (!root) {
    label.hidden = true;
    $('leader').toggleAttribute('hidden', true);
    renderer.domElement.style.cursor = '';
    return;
  }
  root.userData.outline.visible = true;
  renderer.domElement.style.cursor = 'pointer';
  const p = root.userData.piece;
  label.replaceChildren();
  if (!(state === 3 && p.group === selectedGroup)) {
    const grp = document.createElement('span');
    grp.className = 'grp';
    grp.textContent = `${groupOf(p.group).title} › `;
    label.append(grp);
  }
  label.append(document.createTextNode(p.title));
  label.hidden = false;
  $('leader').toggleAttribute('hidden', false);
}

function placeHoverLabel() {
  if (!hovered) return;
  const a = anchorOf(hovered);
  $('hover-label').style.visibility = a.behind ? 'hidden' : '';
  $('leader').style.visibility = a.behind ? 'hidden' : '';
  if (a.behind) return;
  const centre = toScreen(modelCentre.clone());
  const label = $('hover-label');
  const w = label.offsetWidth, h = label.offsetHeight;
  const right = a.x >= centre.x;
  const lx = clamp(right ? a.x + 120 : a.x - 120 - w, 8, window.innerWidth - w - 8);
  const ly = clamp(a.y - 70 - h / 2, 8, window.innerHeight - h - 8);
  label.style.transform = `translate(${lx}px, ${ly}px)`;
  const ex = right ? lx : lx + w;
  const svg = $('leader');
  const line = svg.querySelector('line');
  line.setAttribute('x1', a.x); line.setAttribute('y1', a.y);
  line.setAttribute('x2', ex); line.setAttribute('y2', ly + h / 2);
  const dot = svg.querySelector('circle');
  dot.setAttribute('cx', a.x); dot.setAttribute('cy', a.y);
}

function openPopup(root) {
  const p = root.userData.piece;
  const pop = $('popup');
  pop.querySelector('h2').textContent = p.title;
  pop.querySelector('.dots').textContent = '●'.repeat(p.complexity) + '○'.repeat(5 - p.complexity);
  pop.querySelector('.dots').title = `Complexity ${p.complexity} of 5`;
  pop.querySelector('.grp').textContent = groupOf(p.group).title;
  pop.querySelector('.lead').textContent = p.description;
  pop.querySelector('.details').textContent = p.details;
  pop.querySelector('.example p').textContent = p.example || '';
  pop.querySelector('.example').hidden = !p.example;
  pop.scrollTop = 0;
  pop.hidden = false;
  popupPiece = root;
  placePopup();
}

function closePopup() {
  $('popup').hidden = true;
  popupPiece = null;
}

function placePopup() {
  if (!popupPiece) return;
  const a = anchorOf(popupPiece);
  if (a.behind) { closePopup(); return; }
  const pop = $('popup');
  const w = pop.offsetWidth, h = pop.offsetHeight;
  const right = a.x < window.innerWidth / 2;
  const x = clamp(right ? a.x + 24 : a.x - 24 - w, 8, window.innerWidth - w - 8);
  const y = clamp(a.y - h / 2, 8, window.innerHeight - h - 8);
  pop.style.transform = `translate(${x}px, ${y}px)`;
}

$('popup').querySelector('.close').addEventListener('click', closePopup);

let lastMove = null;
let down = null;
const canvas = renderer.domElement;
canvas.addEventListener('pointermove', (ev) => { lastMove = ev; pointerInside = true; });
canvas.addEventListener('pointerleave', () => { pointerInside = false; setHover(null); });
canvas.addEventListener('pointerdown', (ev) => { down = { x: ev.clientX, y: ev.clientY }; });
canvas.addEventListener('pointerup', (ev) => {
  if (!down || Math.hypot(ev.clientX - down.x, ev.clientY - down.y) > CLICK_SLOP) { down = null; return; }
  down = null;
  handleClick(pick(ev.clientX, ev.clientY));
});

function handleClick(root) {
  if (!root) { closePopup(); return; }
  const group = root.userData.piece.group;
  if (state === 2 || (state === 3 && group !== selectedGroup)) { setState(3, group); return; }
  openPopup(root);
}

// ---------- group labels ----------
const groupLabels = new Map(spec.groups.map((g) => {
  const el = document.createElement('div');
  el.className = 'group-label';
  el.textContent = g.title;
  el.style.borderLeft = `4px solid ${PALETTE[g.color]}`;
  el.hidden = true;
  $('group-labels').append(el);
  return [g.id, el];
}));

function placeGroupLabels() {
  for (const g of spec.groups) {
    const el = groupLabels.get(g.id);
    const show = state > 1 && performance.now() - tweenStart > TWEEN_MS * 0.6;
    el.hidden = !show;
    if (!show) continue;
    const c = groupCentre.get(g.id);
    const off = groupOffset.get(g.id).clone();
    const extraLift = state === 3 && g.id === selectedGroup ? 3.5 : 0;
    const s = toScreen(new THREE.Vector3(c.x, groupTop.get(g.id) + 0.8 + extraLift, c.z).add(off));
    if (s.behind) { el.hidden = true; continue; }
    el.style.transform = `translate(${s.x}px, ${s.y}px) translate(-50%, -100%)`;
    el.style.opacity = state === 3 && g.id !== selectedGroup ? 0.45 : 1;
  }
}

// ---------- loop ----------
function resize() {
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

function frame(now) {
  stepTweens(now);
  controls.update();
  if (pointerInside && lastMove) setHover(pick(lastMove.clientX, lastMove.clientY));
  placeHoverLabel();
  placePopup();
  placeGroupLabels();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
renderControls();
requestAnimationFrame(frame);

// Hook for automated smoke tests.
window.__lego = {
  get state() { return state; },
  get selectedGroup() { return selectedGroup; },
  setState,
  pieceIds: spec.pieces.map((p) => p.id),
  screenPos(id) {
    const root = pieces.find((r) => r.userData.piece.id === id);
    const a = anchorOf(root);
    // Aim slightly below the top face centre so the ray hits the body.
    return { x: a.x, y: a.y + 4 };
  },
  positionsFinite() {
    return pieces.every((r) => ['x', 'y', 'z'].every((k) => Number.isFinite(r.position[k])));
  },
};
window.__legoReady = true;

</script>
</body>
</html>
